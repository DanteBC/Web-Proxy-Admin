<!doctype html>
<html><head><meta charset="utf-8"><title>Dashboard</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main><header><h1>Proxy & routing</h1><p>{{ username }} · <a href="/logout">Logout</a></p></header>
<div class="grid"><section class="card"><h2>Users</h2>
<div class="actions"><input id="login" placeholder="login"><input id="password" type="password" placeholder="password"><button id="add-user">Create</button></div>
<table><thead><tr><th>Login</th><th>Enabled</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></section>
<section class="card"><h2>Routing rules</h2>
<div class="actions"><input id="cidr" placeholder="192.0.2.0/24"><select id="kind"><option>DIRECT</option><option>AWG</option></select><button id="add-rule">Add</button><button id="apply-rules">Apply</button></div>
<table><thead><tr><th>CIDR</th><th>Kind</th><th>Actions</th></tr></thead><tbody id="rules"></tbody></table></section></div>
<section class="card"><h2>Usage</h2><table><thead><tr><th>User</th><th>Day</th><th>In</th><th>Out</th><th>Sessions</th></tr></thead><tbody id="usage"></tbody></table></section>
<section class="card"><h2>Routing status</h2><pre id="route-status"></pre></section></main>
<script src="/static/app.js"></script></body></html>
