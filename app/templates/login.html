<!doctype html>
<html><head><meta charset="utf-8"><title>Web Proxy Admin</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login"><h1>Web Proxy Admin</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>Login <input name="username" autocomplete="username" required></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Sign in</button>
</form></main></body></html>
